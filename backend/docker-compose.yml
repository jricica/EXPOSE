version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: expose-db
    environment:
      MYSQL_DATABASE: expose
      MYSQL_USER: expose_user
      MYSQL_PASSWORD: expose_password
      MYSQL_ROOT_PASSWORD: expose_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "expose_user", "-pexpose_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: expose-dynamodb
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expose-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://expose_user:expose_password@db:3306/expose
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: expose
      DB_USER: expose_user
      DB_PASSWORD: expose_password
      AWS_REGION: us-east-2
      AWS_DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMO_FEED_TABLE: FeedItems
      DYNAMO_FEED_TIMELINE_TABLE: FeedTimeline
      DYNAMO_REL_TABLE: UserRelationships
      DYNAMO_RELATIONSHIPS_TABLE: UserRelationships
      DYNAMO_POST_LIKES_TABLE: PostLikes
      DYNAMO_POST_COMMENTS_TABLE: PostComments
      DYNAMO_POST_SHARES_TABLE: PostShares
      DYNAMO_MESSAGES_TABLE: Messages
      DYNAMO_CONVERSATIONS_TABLE: Conversations
      DYNAMO_FEED_USER_INDEX: UserIdCreatedAtIndex
      DYNAMO_REL_TARGET_INDEX: TargetUserIndex
      JWT_SECRET: development_jwt_secret_change_in_production
      SENTRY_DSN: ""
      AWS_S3_BUCKET: expose-media-dev
    depends_on:
      db:
        condition: service_healthy
      dynamodb:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  adminer:
    image: adminer:latest
    container_name: expose-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data:
  dynamodb_data:

networks:
  default:
    name: expose-network
