version: '3.8'

services:
  # PostgreSQL for local development (easier than MySQL for local dev)
  db:
    image: postgres:15-alpine
    container_name: expose-db
    environment:
      POSTGRES_DB: expose
      POSTGRES_USER: expose_user
      POSTGRES_PASSWORD: expose_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expose_user -d expose"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: expose-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Local DynamoDB
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: expose-dynamodb
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expose-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: expose
      DB_USER: expose_user
      DB_PASSWORD: expose_password
      REDIS_URL: redis://redis:6379
      DYNAMO_ENDPOINT: http://dynamodb:8000
      JWT_SECRET: development_jwt_secret_change_in_production
      SENTRY_DSN: https://46a5b92063fd5cb777eb8eea33f9fb4b@o4510751779192832.ingest.us.sentry.io/4510751781158912
      AWS_REGION: us-east-2
      AWS_S3_BUCKET: expose-media-dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dynamodb:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: expose-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@expose.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  redis_data:
  dynamodb_data:
  pgadmin_data:

networks:
  default:
    name: expose-network